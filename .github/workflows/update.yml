name: update

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Update deepseek-harness
        run: nix develop --command ./scripts/update.sh

      - name: Commit and push
        run: |
          if git diff --quiet -- package.nix package-lock.json; then
            echo "no changes to commit"
            exit 0
          fi
          version="$(sed -n 's/^  version = "\(.*\)";$/\1/p' package.nix | head -n1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.nix package-lock.json
          git commit -m "chore: update deepseek-harness to $version"
          git push
